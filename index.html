<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovare Prototypes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{max-width:480px;width:100%;padding:40px 24px}
  .logo{font-size:13px;font-weight:700;letter-spacing:.06em;color:#888;text-transform:uppercase;margin-bottom:32px}
  h1{font-size:28px;font-weight:700;color:#111;margin-bottom:8px}
  p{font-size:14px;color:#666;margin-bottom:32px;line-height:1.6}
  .list{display:flex;flex-direction:column;gap:12px}
  .item{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:16px 20px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:#ac5ccc;box-shadow:0 2px 12px rgba(172,92,204,.1)}
  .item-left{}
  .item-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#ac5ccc;margin-bottom:4px}
  .item-name{font-size:15px;font-weight:700;color:#111}
  .item-desc{font-size:12px;color:#888;margin-top:3px}
  .item-arrow{color:#ccc;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Innovare · Seraphim Studios</div>
  <h1>Prototypes</h1>
  <p>Working prototypes for the Innovare product team. For review only — not production UI.</p>
  <div class="list">
    <a href="/edai-branding/" class="item">
      <div class="item-left">
        <div class="item-label">EdAI</div>
        <div class="item-name">EdAI Branding &amp; AI Disclosure</div>
        <div class="item-desc">Badge placement, AI disclosure copy, Ask EdAI agent panel</div>
      </div>
      <span class="item-arrow">→</span>
    </a>
    <a href="/edai-strategist-advocate/" class="item">
      <div class="item-left">
        <div class="item-label">EdAI</div>
        <div class="item-name">EdAI Strategist &amp; Advocate Demo</div>
        <div class="item-desc">In progress</div>
      </div>
      <span class="item-arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
